services:
  - type: web
    name: unified-cloud
    runtime: docker
    plan: free
    envVars:
      - key: CLOUD_PASSWORD
        sync: false
      - key: RCLONE_CONFIG_BASE64
        sync: false
      # 1-Click Web OAuth (Sign in with Google, Microsoft, Dropbox, Box)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ONEDRIVE_CLIENT_ID
        sync: false
      - key: ONEDRIVE_CLIENT_SECRET
        sync: false
      - key: DROPBOX_CLIENT_ID
        sync: false
      - key: DROPBOX_CLIENT_SECRET
        sync: false
      - key: BOX_CLIENT_ID
        sync: false
      - key: BOX_CLIENT_SECRET
        sync: false
