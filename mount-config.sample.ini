# הגדרות חיבור כונן MyCloud לסייר הקבצים
# שַׁנֵה את הערכים ושמור כ-mount-config.ini

# אות הכונן הרצויה ב-Windows (ברירת מחדל: Z)
DRIVE_LETTER=Z

# כתובת האתר בענן (לסנכרון החשבונות אם פרסת ב-Render)
SERVER_URL=https://unified-cloud.onrender.com

# סיסמת השרת (אם הגדרת CLOUD_PASSWORD ב-Render)
CLOUD_PASSWORD=
